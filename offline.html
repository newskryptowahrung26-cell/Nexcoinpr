<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline — NexcoinPR</title>
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0A1628">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A1628;
      color: #F8F9FA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .offline-card {
      max-width: 440px;
      text-align: center;
      padding: 48px 36px;
      background: #0D1F3C;
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .offline-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      background: rgba(201, 168, 76, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline-icon svg { width: 36px; height: 36px; }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    h1 span { color: #C9A84C; }
    p {
      font-size: 0.95rem;
      color: #94A3B8;
      line-height: 1.7;
      margin: 0 0 32px;
    }
    .btn {
      display: inline-block;
      background: #C9A84C;
      color: #0A1628;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 14px 32px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #b5943d; }
    .logo {
      margin-bottom: 28px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .logo span { color: #C9A84C; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo">Nexcoin<span>PR</span></div>
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 6s2.5-3 11-3 11 3 11 3M1 12s2.5-3 11-3 11 3 11 3M12 18h.01"/>
        <line x1="4" y1="22" x2="20" y2="2"/>
      </svg>
    </div>
    <h1>You're <span>Offline</span></h1>
    <p>No internet connection detected. Please check your connection and try again. Some pages may still be available from cache.</p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
