name: Daily Press Release Fetcher

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 AM UTC
  workflow_dispatch:      # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch daily press release from FinanceWire
        run: node scripts/fetch_financewire.js

      - name: Fetch daily press release from Decrypt
        run: node scripts/fetch_decrypt.js

      - name: Verify site integrity
        run: node verify_site.js

      - name: Auto-post to LinkedIn
        continue-on-error: true
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID || '106105732' }}
        run: node scripts/post_to_linkedin.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new press release found today."
          else
            git commit -m "Auto-fetch daily press releases from FinanceWire and Decrypt [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
