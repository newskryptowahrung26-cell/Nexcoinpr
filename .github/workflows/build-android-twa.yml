name: Build NexcoinPR Android TWA

on:
  workflow_dispatch:

jobs:
  build-twa:
    name: Build Android App Bundle (SDK 24)
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

          # Bubblewrap specifically checks for $ANDROID_HOME/tools and $ANDROID_HOME/bin
          ln -s $HOME/android-sdk/cmdline-tools/latest $HOME/android-sdk/tools
          ln -s $HOME/android-sdk/cmdline-tools/latest/bin $HOME/android-sdk/bin

          # Accept licenses and install platform & build-tools
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Setup Valid Keystore
        run: |
          # Generate clean, standard PKCS12 keystore matching signing-key-info
          keytool -genkeypair -v \
            -keystore signing.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "BmXzzl5nfft8" \
            -keypass "BmXzzl5nfft8" \
            -dname "CN=NexcoinPR Admin, OU=Engineering, O=NexcoinPR, C=US"

          # Extract SHA-256 fingerprint
          SHA256=$(keytool -list -v -keystore signing.keystore -alias my-key-alias -storepass "BmXzzl5nfft8" | grep -i "SHA256:" | awk '{print $2}')
          echo "NEW_SHA256=${SHA256}" >> $GITHUB_ENV
          echo "Keystore successfully generated with SHA256: ${SHA256}"

      - name: Write twa-manifest.json
        run: |
          cat << EOF > twa-manifest.json
          {
            "packageId": "agency.nexcoinpr.www.twa",
            "host": "www.nexcoinpr.agency",
            "name": "NexcoinPR",
            "launcherName": "NexcoinPR",
            "display": "standalone",
            "themeColor": "#0A1628",
            "navigationColor": "#0A1628",
            "backgroundColor": "#0A1628",
            "enableNotifications": true,
            "startUrl": "/?source=twa",
            "iconUrl": "https://www.nexcoinpr.agency/assets/images/android-chrome-512x512.png",
            "splashScreenFadeOutDuration": 600,
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./signing.keystore",
              "alias": "my-key-alias"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://www.nexcoinpr.agency/site.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://www.nexcoinpr.agency/",
            "minSdkVersion": 24,
            "orientation": "portrait",
            "fingerprints": [
              {
                "name": "release",
                "value": "${NEW_SHA256}"
              }
            ]
          }
          EOF

      - name: Generate Android project files
        run: |
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade
          chmod +x ./gradlew

      - name: Build Android App Bundle
        run: bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Create assetlinks.json helper
        run: |
          cat << EOF > assetlinks.json
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "agency.nexcoinpr.www.twa",
              "sha256_cert_fingerprints": ["${NEW_SHA256}"]
            }
          }]
          EOF
          cat assetlinks.json

      - name: Upload AAB and Keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexcoinPR-Android-SDK24
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            signing.keystore
            assetlinks.json
            ./app/build/outputs/bundle/release/*.aab
            ./app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "=========================================================="
          echo "🎉 NexcoinPR Android App Bundle built successfully!"
          echo "📦 Package: agency.nexcoinpr.www.twa"
          echo "🔧 Min SDK: 24 (Android 7.0+)"
          echo "🔑 SHA256 Fingerprint: ${NEW_SHA256}"
          echo "=========================================================="
