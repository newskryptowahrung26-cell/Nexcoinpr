name: Build NexcoinPR Android TWA

on:
  workflow_dispatch:

jobs:
  build-twa:
    name: Build Android App Bundle (SDK 24)
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

          # Bubblewrap specifically checks for $ANDROID_HOME/tools and $ANDROID_HOME/bin
          ln -s $HOME/android-sdk/cmdline-tools/latest $HOME/android-sdk/tools
          ln -s $HOME/android-sdk/cmdline-tools/latest/bin $HOME/android-sdk/bin

          # Accept licenses and install platform & build-tools
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore

      - name: Write twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "agency.nexcoinpr.www.twa",
            "host": "nexcoinpr.agency",
            "name": "NexcoinPR",
            "launcherName": "NexcoinPR",
            "display": "standalone",
            "themeColor": "#0A1628",
            "backgroundColor": "#0A1628",
            "enableNotifications": true,
            "startUrl": "/?source=twa",
            "iconUrl": "https://nexcoinpr.agency/assets/images/android-chrome-512x512.png",
            "splashScreenFadeOutDuration": 600,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signing": {
              "outputFormat": "AAB",
              "uploadKeystore": "signing.keystore",
              "alias": "my-key-alias",
              "keyPassword": "${{ secrets.KEY_PASSWORD }}",
              "storePassword": "${{ secrets.KEYSTORE_PASSWORD }}"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://nexcoinpr.agency/site.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://nexcoinpr.agency/",
            "minSdkVersion": 24,
            "orientation": "portrait",
            "fingerprints": [
              {
                "name": "release",
                "value": "A9:23:A9:34:8D:4A:3A:CB:AE:06:A9:59:FE:C2:9F:5C:C9:7A:60:30:E0:CF:8A:A5:A7:F5:AF:85:00:3D:28:D7"
              }
            ]
          }
          EOF

      - name: Generate Android project files and checksum
        run: |
          bubblewrap update --manifest=twa-manifest.json --skipVersionCheck || true
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const data = fs.readFileSync('twa-manifest.json');
            const sum = crypto.createHash('sha1').update(data).digest('hex');
            fs.writeFileSync('manifest-checksum.txt', sum);
            console.log('SHA1 checksum generated:', sum);
          "

      - name: Build Android App Bundle
        run: echo "no" | bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexcoinPR-Android-SDK24
          path: |
            app-release-bundle.aab
            app-release-signed.apk
            ./app/build/outputs/bundle/release/*.aab
            ./app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "=== Build Artifacts ==="
          ls -la *.aab *.apk 2>/dev/null || true
          ls -la ./app/build/outputs/bundle/release/ 2>/dev/null || true
