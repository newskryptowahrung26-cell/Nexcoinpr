name: Build NexcoinPR Android TWA

on:
  workflow_dispatch:

jobs:
  build-twa:
    name: Build Android App Bundle (SDK 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install fresh Android SDK from Google
        run: |
          # Download Android commandline-tools directly from Google
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          # Export paths
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Accept licenses and install required SDK components
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

          # Verify
          echo "=== SDK build-tools ==="
          ls $HOME/android-sdk/build-tools/
          echo "=== SDK platforms ==="
          ls $HOME/android-sdk/platforms/

          # Persist to GITHUB_ENV for next steps
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Write Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json
          echo "=== SDK validation check ==="
          ls "$ANDROID_HOME/build-tools/" && echo "build-tools OK" || echo "build-tools MISSING"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore

      - name: Write twa-manifest.json
        run: |
          cat > twa-manifest.json << 'ENDOFFILE'
          {
            "packageId": "agency.nexcoinpr.www.twa",
            "host": "nexcoinpr.agency",
            "name": "NexcoinPR",
            "launcherName": "NexcoinPR",
            "display": "standalone",
            "themeColor": "#0A1628",
            "backgroundColor": "#0A1628",
            "enableNotifications": true,
            "startUrl": "/?source=twa",
            "iconUrl": "https://nexcoinpr.agency/assets/images/android-chrome-512x512.png",
            "splashScreenFadeOutDuration": 600,
            "signing": {
              "outputFormat": "AAB",
              "uploadKeystore": "signing.keystore",
              "alias": "my-key-alias",
              "keyPassword": "BmXzzl5nfft8",
              "storePassword": "BmXzzl5nfft8"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://nexcoinpr.agency/site.webmanifest",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://nexcoinpr.agency/",
            "minSdkVersion": 24,
            "orientation": "portrait",
            "fingerprints": [
              {
                "name": "release",
                "value": "A9:23:A9:34:8D:4A:3A:CB:AE:06:A9:59:FE:C2:9F:5C:C9:7A:60:30:E0:CF:8A:A5:A7:F5:AF:85:00:3D:28:D7"
              }
            ]
          }
          ENDOFFILE

      - name: Build Android App Bundle
        run: bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexcoinPR-Android-SDK24
          path: |
            app-release-bundle.aab
            app-release.apk
          retention-days: 30

      - name: Build summary
        run: ls -lh app-release-bundle.aab app-release.apk 2>/dev/null || echo "Check artifacts tab"
