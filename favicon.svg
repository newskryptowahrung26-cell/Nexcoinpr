<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0F223D"/>
      <stop offset="70%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </radialGradient>

    <!-- Outer Bezel Metal Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A608F"/>
      <stop offset="35%" stop-color="#1E3A5F"/>
      <stop offset="70%" stop-color="#0F2038"/>
      <stop offset="100%" stop-color="#2A4A73"/>
    </linearGradient>

    <!-- Luxury Gold Crescent Gradient -->
    <linearGradient id="goldCrescent" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#8A6518"/>
      <stop offset="25%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#FBE285"/>
      <stop offset="75%" stop-color="#E5B842"/>
      <stop offset="100%" stop-color="#8A6518"/>
    </linearGradient>

    <!-- Cyber Cyan-Blue Globe Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Outer Circle -->
  <circle cx="64" cy="64" r="61" fill="url(#bgGrad)" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Outer Bezel Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#bezelGrad)" stroke-width="4.5"/>

  <!-- Outer Rim Accent Shadow -->
  <circle cx="64" cy="64" r="49" fill="none" stroke="rgba(10,22,40,0.8)" stroke-width="1.5"/>

  <!-- Glowing Gold Crescent on Left Rim -->
  <path d="M 64,15 A 49,49 0 0,0 20,86 A 49,49 0 0,1 36,30 A 49,49 0 0,1 64,15 Z" 
        fill="url(#goldCrescent)" filter="url(#goldGlow)"/>
  <path d="M 64,15 A 49,49 0 0,0 20,86 A 49,49 0 0,1 36,30 A 49,49 0 0,1 64,15 Z" 
        fill="url(#goldCrescent)"/>

  <!-- Inner Globe Dark Recess -->
  <circle cx="64" cy="64" r="35" fill="#071322"/>

  <!-- Wireframe Globe Sphere -->
  <!-- Outer Globe Ring -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="url(#globeGrad)" stroke-width="2.8"/>

  <!-- Equator and Central Meridian -->
  <line x1="30" y1="64" x2="98" y2="64" stroke="url(#globeGrad)" stroke-width="2"/>
  <line x1="64" y1="30" x2="64" y2="98" stroke="url(#globeGrad)" stroke-width="2"/>

  <!-- Longitude Curves (Vertical Ellipses) -->
  <ellipse cx="64" cy="64" rx="14" ry="34" fill="none" stroke="url(#globeGrad)" stroke-width="1.7"/>
  <ellipse cx="64" cy="64" rx="25" ry="34" fill="none" stroke="url(#globeGrad)" stroke-width="1.7"/>

  <!-- Latitude Curves (Horizontal Arcs) -->
  <path d="M 36,50 Q 64,56 92,50" fill="none" stroke="url(#globeGrad)" stroke-width="1.5"/>
  <path d="M 36,78 Q 64,72 92,78" fill="none" stroke="url(#globeGrad)" stroke-width="1.5"/>
  <path d="M 45,39 Q 64,43 83,39" fill="none" stroke="url(#globeGrad)" stroke-width="1.2"/>
  <path d="M 45,89 Q 64,85 83,89" fill="none" stroke="url(#globeGrad)" stroke-width="1.2"/>

  <!-- Intersection Nodes / Connection Points -->
  <circle cx="64" cy="64" r="2.2" fill="#FFFFFF"/>
  <circle cx="50" cy="64" r="1.8" fill="#BAE6FD"/>
  <circle cx="78" cy="64" r="1.8" fill="#BAE6FD"/>
  <circle cx="64" cy="50" r="1.8" fill="#BAE6FD"/>
  <circle cx="64" cy="78" r="1.8" fill="#BAE6FD"/>
  <circle cx="64" cy="30" r="2" fill="#7DD3FC"/>
  <circle cx="64" cy="98" r="2" fill="#7DD3FC"/>
  <circle cx="50" cy="52" r="1.5" fill="#7DD3FC"/>
  <circle cx="78" cy="52" r="1.5" fill="#7DD3FC"/>
  <circle cx="50" cy="76" r="1.5" fill="#7DD3FC"/>
  <circle cx="78" cy="76" r="1.5" fill="#7DD3FC"/>
</svg>